<!DOCTYPE html>
<html>
<head>
  <title>Sửa tài khoản</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h4>✏️ Sửa tài khoản</h4>

<form method="post" action="/admin/users/edit">
  <input type="hidden" name="user_id" value="{{ user[0] }}">

  <div class="mb-2">
    <label>Username</label>
    <input class="form-control" name="username" value="{{ user[1] }}">
  </div>

  <div class="mb-2">
    <label>Password (để trống nếu không đổi)</label>
    <input class="form-control" name="password">
  </div>

  <div class="mb-2">
    <label>Role</label>
    <select class="form-control" name="role">
      <option value="admin" {% if user[2]=='admin' %}selected{% endif %}>Admin</option>
      <option value="user" {% if user[2]=='user' %}selected{% endif %}>User</option>
    </select>
  </div>

  <button class="btn btn-success">Cập nhật</button>
  <a href="/admin/users" class="btn btn-secondary">Hủy</a>
</form>

</body>
</html>
